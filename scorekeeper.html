    <script>
    (function () {
        'use strict';
        var PC = window.PCLive, esc = PC.esc, db = PC.client;
        var params = new URLSearchParams(location.search);
        var kind = params.get('t') ? 't' : (params.get('l') ? 'l' : null);
        var eventId = params.get('t') || params.get('l');
        var scope = kind === 't' ? 'tournament' : 'league';
        var main = document.getElementById('main');
        var snap = null, matchId = null, local = { s1: 0, s2: 0 }, unsub = null, me = null;

        if (!kind || !/^[0-9a-f-]{36}$/i.test(eventId || '')) {
            main.innerHTML = '<div class="state"><h2>Missing event link</h2><p>Open this page from the organizer dashboard or the link your organizer sent you.</p></div>';
            return;
        }

        // ---- outbox ----------------------------------------------------------
        // Every score change is queued here first (and saved to localStorage),
        // then sent to record_score_event ONE AT A TIME, oldest first, each with
        // its own client_event_id. A retry reuses the same id, so the server
        // replays it instead of counting a second point. Network failures back
        // off and retry (and retry at once when the browser comes back online);
        // an expired sign-in keeps the change until the session is back; server
        // refusals are dropped and the board resyncs to the server.
        var OUTBOX_KEY = 'pc_sk_outbox_v1';
        var SEND_TIMEOUT_MS = 10000;
        var MAX_SERVER_ERROR_TRIES = 5;   // a 5xx that carries a SQLSTATE is a server bug, not the network
        var outbox = [];
        var doneIds = {};           // ids this tab sent or removed (so a merge never resurrects them)
        var inFlight = null;        // entry currently being sent
        var retryTimer = null, retryDelay = 0, sendFailing = false, authParked = false;
        var epoch = 0;              // bumps on every tap and every write reply
        var waiters = {};           // client_event_id -> resolve({status})
        var acked = {};             // matchId -> last live score the server confirmed
        var undoing = false;

        function readStored() {
            try {
                var a = JSON.parse(localStorage.getItem(OUTBOX_KEY) || '[]');
                return Array.isArray(a) ? a.filter(function (e) { return e && e.id && e.matchId; }) : [];
            } catch (_) { return []; }
        }
        /** Merge with what other tabs saved, so one tab never erases another's queue. */
        function saveOutbox() {
            try {
                var byId = {};
                readStored().forEach(function (e) { if (!doneIds[e.id]) byId[e.id] = e; });
                outbox.forEach(function (e) { byId[e.id] = e; });
                var all = Object.keys(byId).map(function (k) { return byId[k]; })
                    .sort(function (a, b) { return a.at - b.at; });
                if (all.length) localStorage.setItem(OUTBOX_KEY, JSON.stringify(all));
                else localStorage.removeItem(OUTBOX_KEY);
            } catch (_) { /* private mode / quota: keep the in-memory queue */ }
        }
        /** Pick up this user's saved changes (from a reload, crash or closed tab). */
        function adoptStored() {
            var have = {};
            outbox.forEach(function (e) { have[e.id] = true; });
            readStored().forEach(function (e) {
                if (!have[e.id] && !doneIds[e.id] && (!e.userId || e.userId === me)) outbox.push(e);
            });
            outbox.sort(function (a, b) { return a.at - b.at; });
        }
        function newId() {
            if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
                var r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 3 | 8)).toString(16);
            });
        }
        function pendingFor(id) { return outbox.filter(function (e) { return e.matchId === id; }); }
        function finalQueued(id) { return pendingFor(id).some(function (e) { return e.eventType === 'match_completed'; }); }
        function removeEntry(entry) {
            outbox = outbox.filter(function (e) { return e.id !== entry.id; });
            doneIds[entry.id] = true;
            saveOutbox();
        }

        function enqueue(eventType, note) {
            var entry = { id: newId(), userId: me, scope: scope, matchId: matchId, eventType: eventType,
                          score1: local.s1, score2: local.s2, note: note || null, at: Date.now(), tries: 0 };
            outbox.push(entry);
            epoch++;
            saveOutbox();
            showSync();
            drain();
            return entry;
        }
        /** Resolves after this entry's first send attempt: 'ok' | 'refused' | 'queued' | 'removed'.
         *  Resolves 'queued' at once when the queue is already stuck. */
        function whenTried(entry) {
            return new Promise(function (res) {
                if (sendFailing || authParked) { res({ status: 'queued' }); return; }
                waiters[entry.id] = res;
            });
        }
        /** Final outcome of entries an undo is waiting on: id -> 'ok' | 'refused'. */
        var outcomes = {};
        function settle(id, status, error) {
            if (status === 'ok' || status === 'refused') outcomes[id] = status;
            var w = waiters[id];
            if (w) { delete waiters[id]; w({ status: status, error: error }); }
        }
        function settleAllQueued() {
            Object.keys(waiters).forEach(function (id) { settle(id, 'queued'); });
        }

        function scheduleRetry() {
            retryDelay = Math.min(retryDelay ? retryDelay * 2 : 500, 15000);
            clearTimeout(retryTimer);
            retryTimer = setTimeout(drain, retryDelay);
        }

        async function drain() {
            if (inFlight || !outbox.length) return;
            clearTimeout(retryTimer); retryTimer = null;
            var entry = inFlight = outbox[0];
            entry.tries = (entry.tries || 0) + 1;
            entry.attempted = true;
            saveOutbox();
            try {
                var r = await PC.recordScoreEvent({
                    scope: entry.scope, matchId: entry.matchId, eventType: entry.eventType,
                    score1: entry.score1, score2: entry.score2, note: entry.note, clientEventId: entry.id,
                    timeoutMs: SEND_TIMEOUT_MS,
                });

                epoch++;
                retryDelay = 0; sendFailing = false; authParked = false;
                if (r && r.live) acked[entry.matchId] = { s1: r.live.score1, s2: r.live.score2 };
                // Adopt the server's score only when nothing newer is still queued
                // for this match: a reply must never undo a later tap.
                if (entry.matchId === matchId && !pendingFor(matchId).length && r && r.live && !undoing) {
                    local = { s1: r.live.score1 ?? local.s1, s2: r.live.score2 ?? local.s2 };
                    paintScores();
                }
                err('');
                settle(entry.id, 'ok');
            } catch (e) {
                var serverBug = e.status >= 500 && e.code && entry.tries >= MAX_SERVER_ERROR_TRIES;
                if (PC.isAuthError(e)) {
                    // Signed out / token expired: keep every change, resend after sign-in.
                    authParked = true;
                    inFlight = null;
                    settle(entry.id, 'queued', e); settleAllQueued();
                    showSync();
                    scheduleRetry();  // the client refreshes tokens on its own; onAuthStateChange also retries
                    return;
                }
                if (PC.isTransientError(e) && !serverBug) {
                    sendFailing = true;
                    inFlight = null;
                    settle(entry.id, 'queued', e); settleAllQueued();
                    showSync();
                    scheduleRetry();
                    return;
                }
                // Server refusal (not allowed, match completed, bad score…) or a
                // server error that keeps repeating: retrying won't help. Drop it
                // and resync to server truth.
                removeEntry(entry);
                epoch++;
                retryDelay = 0; sendFailing = false; authParked = false;
                if (entry.matchId === matchId) err(e.message || 'That score change was refused.');
                settle(entry.id, 'refused', e);
                if (!pendingFor(entry.matchId).length) safeRefetch();
            }
            inFlight = null;
            showSync();
            if (outbox.length) drain();
        }

        function retryNow() { if (outbox.length && !inFlight) { retryDelay = 0; drain(); } }
        window.addEventListener('online', retryNow);
        document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') retryNow(); });
        db.auth.onAuthStateChange(function (event, session) {
            if (session && session.user) me = session.user.id;
            if (event === 'SIGNED_IN' || event === 'TOKEN_REFRESHED') setTimeout(retryNow, 0);
        });

        function showSync() {
            var el = document.getElementById('skSync');
            if (!el) return;
            var n = matchId ? pendingFor(matchId).length : 0;
            if (!n) { el.textContent = ''; return; }
            var what = n + ' change' + (n === 1 ? '' : 's');
            el.textContent = authParked ? 'Sign-in expired — ' + what + ' saved on this device. Sign in again to send them.'
                : sendFailing ? 'Offline — ' + what + ' saved on this device, retrying…'
                : 'Saving…';
        }

        function setConn(state) {
            var el = document.getElementById('conn');
            el.hidden = false;
            el.className = 'conn' + (state === 'live' ? ' live' : '');
            document.getElementById('connLabel').textContent = state === 'live' ? 'Live' : 'Reconnecting…';
        }

        function renderLogin() {
            PC.renderAuthCard(main, { title: 'Scorekeeper sign in', blurb: 'Score matches for events you organize or are assigned to.', onSignedIn: async function () { await boot(); } });
        }

        var bootDelay = 0, bootTimer = null;
        function bootLater() {
            bootDelay = Math.min(bootDelay ? bootDelay * 2 : 2000, 30000);
            clearTimeout(bootTimer);
            bootTimer = setTimeout(boot, bootDelay);
        }

        async function boot() {
            var user = await sessionUser();
            if (user) me = user.id;
            adoptStored();
            if (!snap) main.innerHTML = '<div class="state"><h2>Checking your assignment…</h2></div>';
            var check = await db.rpc(kind === 't' ? 'is_tournament_scorer' : 'is_league_scorer',
                kind === 't' ? { p_tournament_id: eventId } : { p_league_id: eventId });
            if (check.error && PC.isTransientError(Object.assign(check.error, { status: check.status }))) {
                // Offline at load: keep sending anything saved on this device, retry the check.
                drain();
                if (!snap) main.innerHTML = '<div class="state"><h2>You’re offline</h2><p>We’ll reconnect automatically.' +
                    (outbox.length ? ' Scores saved on this device will be sent then.' : '') + '</p></div>';
                bootLater();
                return;
            }
            if (check.error || check.data !== true) {
                main.innerHTML = '<div class="state"><h2>You’re not assigned to this event</h2>' +
                    '<p>Have a staff code from the organizer? Enter it below — or ask them to add you in the app (event › Players › Staff).</p>' +
                    '<div class="bar" style="justify-content:center;margin:16px 0"><input id="staffCode" maxlength="6" placeholder="STAFF CODE" ' +
                    'style="font-family:var(--f-mono);font-size:18px;letter-spacing:0.2em;text-transform:uppercase;text-align:center;width:180px;padding:12px;border:1px solid var(--rule-strong);border-radius:10px;background:var(--paper);color:var(--ink)">' +
                    '<button class="btn primary" id="claimBtn">Join staff</button></div>' +
                    '<p class="err" id="claimErr"></p></div>';
                document.getElementById('claimBtn').addEventListener('click', async function () {
                    var code = document.getElementById('staffCode').value.trim();
                    if (code.length !== 6) { document.getElementById('claimErr').textContent = 'Codes are 6 characters.'; return; }
                    this.disabled = true;
                    var r = await db.rpc('claim_staff_code', { p_code: code });
                    if (r.error) { document.getElementById('claimErr').textContent = r.error.message; this.disabled = false; return; }
                    await boot();
                });
                return;
            }
            drain(); // anything left over from before a reload / crash
            var res = await safeRefetch();
            if (!snap) { if (res === 'transient') bootLater(); return; }
            bootDelay = 0;
            if (unsub) return;
            var head = kind === 't' ? snap.tournament : snap.league;
            unsub = PC.subscribeLive(kind, eventId, head.is_public === true, safeRefetch, setConn);
        }

        /** Refetch the snapshot without ever throwing. Resolves 'ok' | 'transient' | 'missing'.
         *  A snapshot requested before a later tap or write reply is still used
         *  for the match list, but never overwrites the score being kept. */
        var refetching = null, refetchAgain = false;
        function safeRefetch() {
            if (refetching) { refetchAgain = true; return refetching; }
            refetching = (async function () {
                try {
                    var outcome = 'ok';
                    do {
                        refetchAgain = false;
                        var startEpoch = epoch, next;
                        try {
                            next = kind === 't' ? await PC.tournamentSnapshot(eventId) : await PC.leagueSnapshot(eventId);
                        } catch (e) {
                            if (snap) { setConn('connecting'); return 'transient'; }   // keep what's on screen
                            main.innerHTML = '<div class="state"><h2>Couldn’t load this event</h2><p>Check your connection — we’ll keep trying.</p></div>';
                            return 'transient';
                        }
                        if (!next) { if (!snap) main.innerHTML = '<div class="state"><h2>Couldn’t load this event</h2></div>'; return 'missing'; }
                        snap = next;
                        render(startEpoch === epoch);
                    } while (refetchAgain);
                    return outcome;
                } finally {
                    refetching = null;
                }
            })();
            return refetching;
        }

        var objMap = {};
        function nameMap() {
            var map = {};
            objMap = {};
            ((kind === 't' ? snap.participants : snap.members) || []).forEach(function (m) { map[m.id] = m.name || 'Player'; objMap[m.id] = m; });
            return map;
        }
        function sides(m) {
            return kind === 't' ? [m.participant1_id, m.participant2_id] : [m.team1_member_id, m.team2_member_id];
        }

        /** fresh: the snapshot is newer than every local tap/reply, so its
         *  live score may replace the local one (when nothing is queued). */
        function render(fresh) {
            var names = nameMap();
            var head = kind === 't' ? snap.tournament : snap.league;
            var open = (snap.matches || []).filter(function (m) {
                var s = sides(m);
                return m.status !== 'completed' && m.status !== 'bye' && s[0] && s[1];
            });
            var current = matchId ? open.find(function (m) { return m.id === matchId; }) : null;

            if (!current) {
                matchId = null;
                var rows = open.map(function (m) {
                    var s = sides(m);
                    var live = m.live ? ' · ' + esc(m.live.score1) + '–' + esc(m.live.score2) : '';
                    return '<div class="event-row"><div class="grow">' +
                        '<div class="title">' + window.PCLive.avatarStack((objMap[s[0]] || {}).members, 18) + ' ' + esc(names[s[0]]) +
                        ' vs ' + window.PCLive.avatarStack((objMap[s[1]] || {}).members, 18) + ' ' + esc(names[s[1]]) + '</div>' +
                        '<div class="sub">' + (m.week ? 'Week ' + esc(m.week) : 'Round ' + esc(m.round || '?')) +
                        (m.court ? ' · ' + esc(m.court) : '') + ' · ' + esc(PC.statusLabel(m.status)) + live + '</div></div>' +
                        '<button class="btn primary" data-pick="' + esc(m.id) + '">Score</button></div>';
                }).join('');
                main.innerHTML = '<div class="event-head"><span class="kicker">Scorekeeper</span><h1>' + esc(head.name) + '</h1></div>' +
                    '<section class="section"><h2>Open matches <span class="count">' + open.length + '</span></h2>' +
                    (rows || '<div class="state"><h2>Nothing to score right now</h2><p>New matches appear here the moment they’re ready.</p></div>') + '</section>';
                Array.prototype.forEach.call(main.querySelectorAll('[data-pick]'), function (b) {
                    b.addEventListener('click', function () {
                        matchId = b.dataset.pick;
                        errMsg = '';
                        var m = open.find(function (x) { return x.id === matchId; });
                        var queued = pendingFor(matchId);
                        var last = queued[queued.length - 1];
                        local = last ? { s1: last.score1, s2: last.score2 }
                            : (m && m.live ? { s1: m.live.score1, s2: m.live.score2 } : { s1: 0, s2: 0 });
                        render(false);
                    });
                });
                return;
            }

            var s = sides(current);
            if (fresh && current.live && !pendingFor(matchId).length && !undoing) local = { s1: current.live.score1, s2: current.live.score2 };
            var locked = undoing || finalQueued(matchId);
            var dis = locked ? ' disabled' : '';
            main.innerHTML =
                '<div class="event-head"><span class="kicker">' + (current.week ? 'Week ' + esc(current.week) : 'Round ' + esc(current.round || '?')) +
                (current.court ? ' · ' + esc(current.court) : '') + '</span>' +
                '<h1 style="font-size:1.3rem">' + esc(head.name) + '</h1></div>' +
                '<div class="sk-board">' + skSide(1, names[s[0]], local.s1, objMap[s[0]], dis) + skSide(2, names[s[1]], local.s2, objMap[s[1]], dis) + '</div>' +
                '<div class="sk-actions">' +
                (current.status !== 'in_progress' ? '<button class="btn" id="startBtn"' + dis + '>Start match</button>' : '') +
                '<button class="btn ghost" id="undoBtn"' + dis + '>Undo last</button>' +
                '<button class="btn primary" id="finalBtn"' + dis + '>Submit final score</button>' +
                '<button class="btn ghost" id="backBtn">All matches</button>' +
                '</div><p class="ok" id="skSync" role="status" aria-live="polite" style="text-align:center"></p>' +
                '<p class="err" id="skErr" style="text-align:center"></p>';

            wireSk();
            showSync();
            err(errMsg);
        }

        function skSide(n, name, score, obj, dis) {
            return '<div class="sk-side"><div class="team">' + window.PCLive.avatarStack((obj || {}).members, 26) + ' ' + esc(name || 'Player') + '</div>' +
                '<div class="score" id="score' + n + '">' + esc(score) + '</div>' +
                '<div class="sk-buttons"><button class="sk-minus" data-minus="' + n + '" aria-label="Remove point"' + (dis || '') + '>−1</button>' +
                '<button class="sk-plus" data-plus="' + n + '" aria-label="Add point"' + (dis || '') + '>+1</button></div></div>';
        }

        function paintScores() {
            var a = document.getElementById('score1'), b = document.getElementById('score2');
            if (a) a.textContent = local.s1;
            if (b) b.textContent = local.s2;
        }

        var errMsg = '';
        function err(msg) { errMsg = msg || ''; var el = document.getElementById('skErr'); if (el) el.textContent = errMsg; }

        function bump(side, delta) {
            if (undoing || finalQueued(matchId)) return;
            var key = 's' + side;
            var next = Math.max(0, local[key] + delta);
            if (next === local[key]) return;
            local[key] = next;
            document.getElementById('score' + side).textContent = next; // optimistic, same frame as the tap
            enqueue(delta > 0 ? 'point_added' : 'point_removed');
        }

        /** Wait until nothing for this match is queued or in flight.
         *  Resolves 'done', or 'stuck' as soon as the queue is parked
         *  (offline / signed out) so an undo never locks the board. */
        function flushed(id) {
            return new Promise(function (res) {
                (function poll() {
                    if (!pendingFor(id).length) res('done');
                    else if (sendFailing || authParked) res('stuck');
                    else setTimeout(poll, 50);
                })();
            });
        }
        var UNDO_OFFLINE = 'Offline — undo will be available when you reconnect.';

        function wireSk() {
            Array.prototype.forEach.call(main.querySelectorAll('[data-plus]'), function (b) {
                b.addEventListener('click', function () { bump(parseInt(b.dataset.plus, 10), +1); });
            });
            Array.prototype.forEach.call(main.querySelectorAll('[data-minus]'), function (b) {
                b.addEventListener('click', function () { bump(parseInt(b.dataset.minus, 10), -1); });
            });
            var startBtn = document.getElementById('startBtn');
            if (startBtn) startBtn.addEventListener('click', async function () {
                startBtn.disabled = true;
                var res = await whenTried(enqueue('match_started'));
                if (res.status === 'queued') { err('Offline — the start will be sent when you reconnect.'); return; }
                await safeRefetch();
            });
            document.getElementById('undoBtn').addEventListener('click', async function () {
                var id = matchId;
                // A change that has never been sent: just take it back locally.
                // (One that was attempted may already be on the server — a lost
                // reply — so it goes through the server undo below.)
                var queued = pendingFor(id);
                var tail = queued[queued.length - 1];
                if (tail && !tail.attempted && tail !== inFlight) {
                    removeEntry(tail);
                    settle(tail.id, 'removed');
                    epoch++;
                    var prev = queued[queued.length - 2];
                    var m = snap && (snap.matches || []).find(function (x) { return x.id === id; });
                    local = prev ? { s1: prev.score1, s2: prev.score2 }
                        : (acked[id] || (m && m.live ? { s1: m.live.score1, s2: m.live.score2 } : { s1: 0, s2: 0 }));
                    paintScores(); showSync();
                    return;
                }
                // The server undo has to wait for our queued changes to land.
                // Offline that could take forever, so don't lock the board.
                if (tail && (sendFailing || authParked)) { err(UNDO_OFFLINE); return; }
                var tailId = tail ? tail.id : null, resync = false;
                undoing = true;
                render(false);              // locks +1/−1/Final while the server undo runs
                try {
                    // The server undoes its last event, so let ours land first.
                    if (await flushed(id) === 'stuck') { err(UNDO_OFFLINE); return; }
                    // The tap being undone was refused: it never happened on the
                    // server, and undoing there would delete the point before it.
                    // drain() already showed the refusal; resync once unlocked.
                    if (tailId && outcomes[tailId] === 'refused') { resync = true; return; }
                    var r = await PC.undoLastScoreEvent(scope, id);
                    epoch++;
                    local = r && r.live ? { s1: r.live.score1 ?? 0, s2: r.live.score2 ?? 0 } : { s1: 0, s2: 0 };
                    acked[id] = { s1: local.s1, s2: local.s2 };
                    err('');
                } catch (e) { err(e.message || 'Nothing to undo.'); }
                finally {
                    if (tailId) delete outcomes[tailId];
                    undoing = false;
                    if (matchId === id) render(false);
                    if (resync) safeRefetch();
                }
            });
            document.getElementById('finalBtn').addEventListener('click', async function () {
                if (local.s1 === local.s2) { err('A final score can’t be tied.'); return; }
                if (finalQueued(matchId)) return;
                if (!confirm('Submit final: ' + local.s1 + '–' + local.s2 + '? This locks the match.')) return;
                var entry = enqueue('match_completed', 'scorekeeper final');
                render(false);              // Final stays disabled while it is queued
                var res = await whenTried(entry);
                if (res.status === 'queued') { err('Offline — the final score is saved on this device and will be submitted when you reconnect.'); return; }
                if (res.status !== 'ok') { if (matchId) render(false); return; }
                matchId = null;
                await safeRefetch();
            });
            document.getElementById('backBtn').addEventListener('click', function () { matchId = null; errMsg = ''; render(false); });
        }

        /** The signed-in user from the locally stored session — no network,
         *  so a scorer who reloads while offline still gets their board. */
        async function sessionUser() {
            try {
                var r = await db.auth.getSession();
                return r.data && r.data.session ? r.data.session.user : null;
            } catch (_) { return null; }
        }

        (async function init() {
            var user = await sessionUser();
            if (!user) renderLogin();
            else await boot();
        })();
    })();
    </script>
</body>
