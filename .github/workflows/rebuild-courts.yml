name: Rebuild court pages

# Court data changes in the app (new submissions, corrections, OSM imports) but
# these pages are generated at build time, so without this they would freeze at
# whenever someone last ran the generator by hand.
on:
  schedule:
    - cron: "17 9 * * 1"        # Mondays 09:17 UTC
  workflow_dispatch:            # and on demand

permissions:
  contents: write
  pull-requests: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate every court page from live data
        working-directory: tools/courtgen
        run: python3 build_site.py --index

      - name: Verify the publication gate held
        run: |
          set -e
          # Two thirds of the courts table was scraped from PlayPickleball and
          # must never reach a public page. If any of these venue names appear,
          # the gate has been bypassed and we must not commit.
          for name in "Austin Tennis & Pickleball Center" "TownLake YMCA" "East Communities YMCA"; do
            if grep -rqF "$name" courts/; then
              echo "PUBLICATION GATE BREACH: '$name' found in generated pages."
              exit 1
            fi
          done
          # Claims that have no backing data must not appear either.
          for term in "Player verified" "Open daily"; do
            if grep -rqF "$term" courts/; then
              echo "CLAIM GATE BREACH: '$term' found in generated pages."
              exit 1
            fi
          done

          # ODbL attribution is a CONDITION of using OpenStreetMap data, not a
          # nicety, and the OSM Foundation's guidelines ask for a real link in
          # browsable media rather than prose naming the licence. Every single
          # generated page must carry both links. This is asserted by count,
          # not by sampling: a template edit that drops the credit from one
          # page type would otherwise ship silently, which is exactly how the
          # text-only version survived on 2,358 pages before.
          TOTAL=$(find courts -name '*.html' | wc -l | tr -d ' ')
          for token in "openstreetmap.org/copyright" "opendatacommons.org/licenses/odbl"; do
            HAVE=$(grep -rl "$token" courts/ --include='*.html' | wc -l | tr -d ' ')
            if [ "$HAVE" != "$TOTAL" ]; then
              echo "ATTRIBUTION GATE BREACH: only $HAVE of $TOTAL pages link $token."
              exit 1
            fi
          done

          # The notices page must exist and must still embed real licence text,
          # because MapLibre (BSD-3) and the OFL fonts require us to ship it.
          for f in licenses.html assets/vendor/LICENSE-maplibre.txt \
                   assets/vendor/LICENSE-lucide.txt fonts/LICENSE-fraunces.txt \
                   fonts/LICENSE-instrument-sans.txt fonts/LICENSE-jetbrains-mono.txt; do
            if [ ! -s "$f" ]; then
              echo "LICENCE GATE BREACH: $f is missing or empty."
              exit 1
            fi
          done

          echo "Gate holds. $TOTAL pages generated, all attributed."

      - name: Summarise what changed
        id: diff
        run: |
          if git diff --quiet -- courts sitemap.xml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No court data changed this week."
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          {
            echo "pages_changed=$(git diff --name-only -- courts | wc -l | tr -d ' ')"
            echo "pages_added=$(git ls-files --others --exclude-standard courts | wc -l | tr -d ' ')"
            echo "courts_total=$(grep -o 'COURTS' -c courts/us/texas/austin.html || true)"
          } >> "$GITHUB_OUTPUT"

      - name: Open a pull request
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: courts/weekly-rebuild
          delete-branch: true
          add-paths: |
            courts
            sitemap.xml
          commit-message: "courts: weekly rebuild from live data"
          title: "courts: weekly rebuild from live data"
          body: |
            Automated weekly regeneration of the court pages from live Supabase.

            - ${{ steps.diff.outputs.pages_changed }} page(s) modified
            - ${{ steps.diff.outputs.pages_added }} page(s) added

            The publication gate ran as a build step and passed: no
            PlayPickleball-sourced venue names and no unbacked claims appear in
            the generated output. Merging deploys these pages.
